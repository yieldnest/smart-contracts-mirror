[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test/unit"
evm_version = "cancun"
optimizer = true
optimizer-runs = 100
solc_version = "0.8.28"

# the following is needed after https://github.com/foundry-rs/foundry/pull/9537
allow_internal_expect_revert = true
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./" },
]

[profile.mainnet]
src = "src"
out = "out"
libs = ["lib"]
test = "test/integration"
eth_rpc_url = "eth_mainnet"
evm_version = "cancun"
optimizer = true
optimizer-runs = 100
solc_version = "0.8.28"
allow_internal_expect_revert = true
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./" },
]

[rpc_endpoints]
eth_mainnet = "${ETH_MAINNET_RPC_URL}"

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
